[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "cellfree-mimo-gnn-robustness"
version = "0.1.0"
description = "A transparent toy-scale CF-mMIMO GNN power-control pilot study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.0", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=7"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
